      title:'Dujiangyan *& Shuijingfang*',

      title:'The Giant Buddha *& The Chuan*',
      body:['A river cruise to the Leshan Giant Buddha, carved into the cliff in the Tang dynasty and, at 71 metres, the largest stone Buddha in the world, seen whole from the water where three rivers meet.',

      meta:[['Overnight','Hongzhushan Hotel, Mount Emei'],['Dinner','The Chuan distillery']] },

      title:'Mount Emei *to Ningxia*',
      body:['A slow start at Hongzhushan, set in primeval forest at the foot of Mount Emei, with radon hot springs and private forest trails.',

            'An afternoon flight to Yinchuan, then the Amnor Hotel among the vineyards on the eastern slopes of the Helan Mountain, for a private welcome dinner prepared for the group.'],

    { type:'spread', flip:true, imgs:[I('w-tombs'), I('winery'), I('barrels')], daynum:'Day 5 · Wednesday',
      title:'The Helan Mountain *vineyards*',
      body:['Morning at the Western Xia Imperial Tombs, newly inscribed by UNESCO, and the museum’s Silk Road treasures from the lost Tangut kingdom.',

            'Dinner is a goji-themed vegetarian banquet at the Bairuiyuan manor, among 1,500 mu of organic goji orchards.'],
      meta:[['Lunch','Tan lamb hot pot'],['Dinner','Goji banquet, Bairuiyuan']] },

    { type:'spread', imgs:[I('jeep'), I('camels')], daynum:'Day 6 · Thursday',
      title:'Off-road *to the Tengger*',
      body:['An off-road morning at Hooke Park in the Helan Mountains, on the border of Ningxia and Inner Mongolia: 4WD routes up the mountain and a well-preserved stretch of the Ming Great Wall.',
            'Lunch at Wuzhong Guoqiang, a century-old landmark for hand-grabbed Tan lamb, Muslim pastries and Babao tea.',
            'In the afternoon, on to the Tengger Desert and desert-view rooms at Desert Star. Camel treks and desert safaris can be added.'],
      meta:[['Overnight','Desert Star Hotel'],['Lunch','Wuzhong Guoqiang']] },

    { type:'mosaic', layout:'m2', kicker:'Tengger Desert', title:'A night *among the dunes*',
      text:'Far from any light pollution, Desert Star is a stargazing resort deep in the Tengger. Most rooms have floor-to-ceiling windows over the dunes, and on a clear night the Milky Way is overhead.',

    { type:'spread', flip:true, imgs:[I('w-yellowriver'), I('raft'), I('xige')], daynum:'Days 7 & 8',
      title:'The Yellow River *& Xige Estate*',
      body:['Two classic Yellow River experiences at Shapotou: sand sliding down the dunes and a drift on a sheepskin raft, a craft used for millennia, where the desert meets the river.',

      meta:[['Overnight','Xige Estate Vineyard Hotel'],['Dinner','At the estate']] },
